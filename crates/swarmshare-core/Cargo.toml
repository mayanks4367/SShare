[package]
name = "swarmshare-core"
version = "0.1.0"
edition = "2021"
description = "Core chunking, manifest, store, picker and crypto for SwarmShare P2P file sharing"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = "1"
sha2 = "0.10"
hex = "0.4"
zstd = "0.13"
chacha20poly1305 = { version = "0.10", features = ["alloc"] }
rand = "0.8"
