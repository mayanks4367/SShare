[package]
name = "swarmshare"
version = "0.1.0"
edition = "2021"
description = "SwarmShare — decentralized P2P file sharing (CLI + gateway)"
default-run = "swarmshare"

[[bin]]
name = "swarmshare"
path = "src/main.rs"

[dependencies]
swarmshare-core = { path = "../swarmshare-core" }
swarmshare-net = { path = "../swarmshare-net" }
swarmshare-protocol = { path = "../swarmshare-protocol" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
hex = "0.4"
axum = { version = "0.7", features = ["macros"] }
libp2p = { version = "0.56" }
