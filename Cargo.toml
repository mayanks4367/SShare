[workspace]
members = [
    "crates/swarmshare-core",
    "crates/swarmshare-net",
    "crates/swarmshare-protocol",
    "crates/swarmshare-cli",
]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
